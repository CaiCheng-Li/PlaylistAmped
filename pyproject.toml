[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlistamp"
version = "0.1.0"
description = "Mirror a YouTube Music playlist into a Plex playlist for Plexamp"
requires-python = ">=3.11"
dependencies = [
    "ytmusicapi>=1.7",
    "plexapi>=4.15",
    "rapidfuzz>=3.6",
    "rich>=13.7",
    "platformdirs>=4.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
playlistamp = "playlistamp.cli:main"

[tool.setuptools.packages.find]
include = ["playlistamp*"]

[tool.setuptools.package-data]
playlistamp = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
