[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "playlistamped"
version = "0.1.0"
description = "Mirror a YouTube Music or Spotify playlist into a Plex playlist for Plexamp"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
keywords = ["plex", "plexamp", "playlist", "spotify", "youtube-music"]
dependencies = [
    "ytmusicapi>=1.7",
    "plexapi>=4.15",
    "rapidfuzz>=3.6",
    "platformdirs>=4.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
playlistamped = "playlistamped.app:main"

[tool.setuptools.packages.find]
include = ["playlistamped*"]

[tool.setuptools.package-data]
playlistamped = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
